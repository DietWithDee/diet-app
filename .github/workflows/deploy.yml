name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_PAYSTACK_SECRET_KEY: ${{ secrets.VITE_PAYSTACK_SECRET_KEY }}
          VITE_WEBSITE_URL: ${{ secrets.VITE_WEBSITE_URL }}
          VITE_EMAIL_PROXY_URL: ${{ secrets.VITE_EMAIL_PROXY_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Ensure Sitemap in Dist
        run: cp public/sitemap.xml dist/sitemap.xml

      - name: Prerender
        run: node scripts/prerender.mjs

      - name: Post-build steps
        run: |
          cp dist/index.html dist/404.html
          echo "dietwithdee.org" > dist/CNAME

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install Firebase Functions Dependencies
        run: cd functions && npm install

      - name: Deploy Firestore Rules and Batched Firebase Functions
        run: |
          firebase deploy --only firestore:rules --force --token "${{ secrets.FIREBASE_TOKEN }}"

          BATCHES=$(node -e "const keys = Object.keys(require('./functions/index.js')); for (let i = 0; i < keys.length; i += 2) console.log(keys.slice(i, i + 2).map((k) => 'functions:' + k).join(','));")
          echo "Deploying Firebase Functions in batches of 2 to stay within Cloud Run regional CPU quotas:"
          echo "$BATCHES"

          FIRST=true
          while IFS= read -r TARGETS; do
            [ -z "$TARGETS" ] && continue
            if [ "$FIRST" = false ]; then
              sleep 20
            fi
            FIRST=false

            echo "Deploying batch: $TARGETS"
            if ! firebase deploy --only "$TARGETS" --force --token "${{ secrets.FIREBASE_TOKEN }}"; then
              echo "Deploy batch hit transient quota error ($TARGETS); waiting 90s before retry..."
              sleep 90
              firebase deploy --only "$TARGETS" --force --token "${{ secrets.FIREBASE_TOKEN }}"
            fi
          done <<< "$BATCHES"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
